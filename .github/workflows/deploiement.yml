# Vérifie le projet à chaque envoi, puis publie le site sur GitHub Pages
# lorsque la branche envoyée est la branche par défaut du dépôt.
name: Vérification et déploiement

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois, sans interrompre celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verification:
    name: Tests et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx tsc -b --noEmit

      - name: Lancer les vérifications du moteur
        run: npm test

      # Les pictogrammes ne sont pas versionnés : on les récupère ici, et on
      # les garde en cache d'une publication à l'autre. Si ARASAAC est
      # injoignable, le site se construit quand même, avec les emojis.
      - name: Réutiliser les pictogrammes déjà téléchargés
        uses: actions/cache@v4
        with:
          path: |
            public/pictos
            src/lexique/pictogrammes.json
            src/lexique/pictogrammes-absents.json
          key: pictogrammes-${{ hashFiles('src/lexique/noms.ts', 'src/lexique/verbes.ts', 'src/lexique/mots.ts') }}
          restore-keys: pictogrammes-

      - name: Récupérer les pictogrammes ARASAAC
        run: npm run pictogrammes -- --tolerant

      - name: Construire le site
        run: npm run build

      - name: Préparer le site pour la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploiement:
    name: Publication sur GitHub Pages
    needs: verification
    # Seule la branche par défaut est mise en ligne.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      # GitHub n'autorise pas toujours le jeton du workflow à créer le site
      # Pages : dans ce cas, l'étape suivante explique quoi faire, une fois.
      - name: Activer GitHub Pages si besoin
        id: configuration
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Expliquer comment activer GitHub Pages
        if: steps.configuration.outcome == 'failure'
        run: |
          {
            echo "## GitHub Pages n'est pas encore activé sur ce dépôt"
            echo
            echo "Le site a bien été construit, mais il ne peut pas être publié tant que"
            echo "Pages n'est pas activé. C'est une manipulation à faire **une seule fois** :"
            echo
            echo "1. ouvrir **Settings → Pages** :"
            echo "   <https://github.com/${{ github.repository }}/settings/pages>"
            echo "2. dans **Build and deployment**, choisir la source **GitHub Actions** ;"
            echo "3. revenir dans l'onglet **Actions** et relancer ce workflow"
            echo "   (*Re-run all jobs*)."
            echo
            echo "Les envois suivants se publieront ensuite tout seuls."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=GitHub Pages à activer::Settings → Pages → Source : GitHub Actions, puis relancer ce workflow."
          exit 1

      - name: Mettre le site en ligne
        id: publication
        uses: actions/deploy-pages@v4

      - name: Rappeler l'adresse du site
        run: |
          {
            echo "## Site en ligne"
            echo
            echo "<${{ steps.publication.outputs.page_url }}>"
          } >> "$GITHUB_STEP_SUMMARY"
